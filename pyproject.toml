[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecl-api"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Marco Del Tutto", email = "marco.deltutto@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "requests",
]

[project.optional-dependencies]
# ecl_api.mcp targets the pre-2.0 SDK: it imports mcp.server.fastmcp, which
# mcp 2.x removed (FastMCP was renamed to MCPServer). An unbounded ">=1.0.0"
# resolves happily to 2.x and then fails at import time, so cap it.
mcp = [
  "mcp>=1.0.0,<2",
  "uvicorn>=0.27.0",
]

# NOTE: console scripts are installed unconditionally -- the [mcp] extra gates
# the dependencies, not these entry points. So every downstream consumer gets
# these names in its venv whether or not it asked for the extra, and a name
# claimed here will overwrite a same-named script from another distribution
# (last install wins). Keep these prefixed/specific for that reason: a bare
# `ecl-mcp` alias used to live here and silently clobbered the unrelated
# ecl-mcp distribution's own entry point in Mu2e/aitools (mcp/ecl), whose
# wrapper then ran this v1 code against mcp 2.x.
[project.scripts]
ecl-mcp-server = "ecl_api.mcp.http:main"
ecl-mcp-stdio = "ecl_api.mcp.stdio:main"

[project.urls]
Documentation = "https://github.com/marcodeltutto/ecl-api#readme"
Issues = "https://github.com/marcodeltutto/ecl-api/issues"
Source = "https://github.com/marcodeltutto/ecl-api"

[tool.hatch.version]
path = "src/ecl_api/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/ecl_api tests}"

[tool.coverage.run]
source_pkgs = ["ecl_api", "tests"]
branch = true
parallel = true
omit = [
  "src/ecl_api/__about__.py",
]

[tool.coverage.paths]
ecl_api = ["src/ecl_api", "*/ecl-api/src/ecl_api"]
tests = ["tests", "*/ecl-api/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
